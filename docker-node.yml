---
- name: Setup Docker and Portainer
  hosts: dockernode
  become: true
  vars_files:
    - secrets.yaml

  roles:
    - certbot_local
    - geerlingguy.docker

  pre_tasks:
    - name: Install the latest version of python3-docker
      ansible.builtin.package:
        name:
          - python3-docker
          - gnupg2
        state: present

  tasks:
    - name: Certbot | Generate Certificate
      ansible.builtin.command:
        argv:
          - certbot
          - certonly
          - --non-interactive
          - --agree-tos
          - --dns-cloudflare
          - --dns-cloudflare-credentials
          - /etc/letsencrypt/dnscloudflare.ini
          - -m
          - "{{ certbot_mail }}"
          - -d
          - "{{ inventory_hostname }}"
          - -d
          - "*.{{ inventory_hostname }}"
      args:
        creates: "/etc/letsencrypt/renewal/{{ inventory_hostname }}.conf"

    # docker worker nodes

    - name: Docker | Ensure cron is installed
      ansible.builtin.package:
        name: "{{ 'cron' if ansible_os_family == 'Debian' else 'cronie' }}"
        state: present

    - name: Docker | Schedule daily cleanup of unused images
      ansible.builtin.cron:
        name: docker-image-prune-daily
        user: root
        minute: "15"
        hour: "17"
        job: "/usr/bin/docker image prune -af >/var/log/docker-image-prune.log 2>&1"

    - name: Custom docker config
      ansible.builtin.template:
        src: daemon.json.j2
        dest: /etc/docker/daemon.json
        mode: "0644"
      notify: Restart Docker
      when: "'infra' not in group_names"

  handlers:
    - name: Import common handlers
      ansible.builtin.import_tasks: handlers/main.yml
